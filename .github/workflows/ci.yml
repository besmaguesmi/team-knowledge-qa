name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint (optional)
        run: pip install flake8 && flake8 backend/app
      - name: Run unit tests (if you add them)
        run: echo "Add pytest tests later"